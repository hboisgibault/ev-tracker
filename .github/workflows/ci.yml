name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Tests
        run: pnpm test

      # Gated on critical only: 15 high / 7 moderate advisories are
      # pre-existing transitive debt (xlsx, adm-zip, js-yaml via eslint…)
      # with no fixed range. Revisit when those upstreams ship fixes.
      - name: Audit dependencies
        run: pnpm audit --audit-level=critical
